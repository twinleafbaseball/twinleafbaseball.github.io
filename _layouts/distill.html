<!doctype html>
<meta charset="utf-8">
<head>
  <script src="https://distill.pub/template.v2.js"></script>
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  <style>
    d-byline .byline > div:last-child {
      display: none;
    }
  </style>
</head>
<d-front-matter>
  <script type="text/json">{
    "title": "{{ page.title }}",
    "description": "{{ page.description }}",
    "published": "{{ page.date }}",
    "authors": [
      {% for author in page.authors %}
      {
        "author": "{{ author.name }}",
        "authorURL": "{{ author.url }}",
        "affiliation": "{{ author.affil }}",
        "affiliationURL": "{{ author.affil_url }}"
      }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ],
    "katex": {
      "delimiters" : [
        {"left": "$", "right": "$", "display": false}
      ]
    }
  }</script>

</d-front-matter>
{%- include header.html -%}
{% if page.thumbnail %}
  <figure class="l-screen">
  <img src={{ page.thumbnail | relative_url }}>
  </figure>
{% endif %}
<d-title>
  <h1>{{ page.title }}</h1>
  {% if page.description %}
    <p>{{ page.description }}</p>
  {% endif%}
</d-title>
<d-byline></d-byline>
<d-article>
  <!-- <h2>Section Headline</h2> -->
  {{ content }}
</d-article>

<d-appendix>
  <d-bibliography></d-bibliography>
</d-appendix>
